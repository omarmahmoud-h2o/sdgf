[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sdgf"
version = "0.1.0"
description = "Synthetic Data Generation Framework: governed, spec-driven synthetic data generation"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyyaml",
    "jsonschema",
    "numpy",
]

[project.scripts]
sdgf = "sdgf.cli:main"

[project.optional-dependencies]
pii = ["presidio-analyzer", "presidio-anonymizer"]
toxicity = ["detoxify"]
embeddings = ["sentence-transformers"]
retrieval = ["rank-bm25"]
dev = ["pytest", "ruff"]
docs = ["markdown>=3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sdgf = ["tools/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
