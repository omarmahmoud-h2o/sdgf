<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sdgf Guide</title>
<meta name="description" content="How sdgf turns a task spec into a checked, released synthetic dataset: overview, the six checks, and setting up a new use case.">
<!-- Generated by docs/build_guide.py from docs/*.md, CONTEXT.md and docs/diagrams/. Don't edit by hand. -->
<style>
{{css}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="brand-mark" aria-hidden="true">sd</span><span>sdgf guide</span></div>
  <nav class="tabs" role="tablist" aria-label="Guide sections">{{tabs}}</nav>
  <div class="tools">
    <div class="search">
      <input type="search" id="search" placeholder="Search the guide" aria-label="Search the guide" autocomplete="off">
      <div class="search-results" id="search-results" role="listbox" hidden></div>
    </div>
    <button type="button" class="tool-btn" id="glossary-btn" aria-haspopup="dialog">Glossary</button>
    <button type="button" class="tool-btn" id="theme-btn" aria-label="Theme">Theme: auto</button>
  </div>
</header>
<div class="layout">
  <aside class="sidebar">
    <details class="toc-wrap" open>
      <summary>On this page</summary>
      <nav id="toc" aria-label="On this page"></nav>
    </details>
  </aside>
  <main id="main">{{panels}}</main>
</div>
<dialog id="glossary" aria-labelledby="glossary-title">
  <div class="dialog-head">
    <h2 id="glossary-title">Glossary</h2>
    <button type="button" class="tool-btn" id="glossary-close">Close</button>
  </div>
  <div class="dialog-body">{{glossary_html}}</div>
</dialog>
<div class="term-tip" id="term-tip" role="tooltip" hidden></div>
<script type="application/json" id="glossary-data">{{glossary_json}}</script>
<script type="application/json" id="layer-data">{{layers_json}}</script>
<script type="application/json" id="diagram-data">{{diagrams_json}}</script>
<script>
{{js}}
</script>
</body>
</html>
